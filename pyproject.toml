[project]
name = "kawata-web"
version = "2.0.0"
description = "Kawata web application - Quart-based web frontend for gulag server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Kawata Team"}
]
keywords = ["quart", "web", "guweb", "osu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "cmyui",
    "quart",
    "bcrypt",
    "aiomysql",
    "cryptography",
    "aiohttp",
    "mysql-connector-python",
    "orjson",
    "timeago",
    "markdown2",
    "Pillow",
    "python-dotenv",
    "redis==5.0.0; python_version >= '3.7'",
    "discord-webhook",
    "PyYAML",
    "structlog",
    "python-logstash",
    "elasticsearch",
    "jsons",
    "python-json-logger",
    "python-rapidjson",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "ty==0.0.29",
    "pre-commit>=3.0",
    "bandit>=1.7",
    "isort>=5.12",
    "autoflake>=2.0",
]

[project.scripts]
kawata-web = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["objects", "blueprints", "constants"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]