<!-- ==========================================================================
   User Profile Component Templates
   ==========================================================================
   
   X-Template definitions for all user profile components.
   These templates are loaded via base.html and referenced by component definitions.
   
   Atomic Components:
   - user-avatar-template
   - user-username-template
   - user-badges-template
   - user-banner-template
   - user-stats-template
   - user-status-template
   - user-flag-template
   - user-clan-template
   - user-rank-template
   
   Composed Components:
   - user-hover-panel-template
   - user-card-template
   - user-search-template
   - user-username-hover-template
   ========================================================================== -->

<!-- ==========================================================================
   Section: Atomic Component Templates
   ========================================================================== -->

  <!-- User Avatar Template -->
    <script type="text/x-template" id="user-avatar-template">
        <div :class="avatarClasses" :style="avatarStyles">
            <!-- Loading state -->
            <div v-if="!userData" class="user-profile-avatar__loading">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
        </div>
    </script>

  <!-- User Username Template -->
    <script type="text/x-template" id="user-username-template">
        <span class="user-name" v-if="username">
            <!-- Country flag (if enabled) -->
            <span v-if="showCountry && country" class="user-country">
                <img :src="flagUrl" :alt="country" class="user-flag" />
            </span>

            <!-- Clan tag (if enabled) -->
            <span v-if="showClan && clanTag" class="user-clan">
                <a :href="clanUrl" @click.stop="handleClanClick" class="user-clan-link">
                    <span v-text="'[' + clanTag + ']'"></span>
                </a>
            </span>

            <!-- Username (always shown) -->
            <a :href="profileUrl" class="user-username-link">
                <span v-text="username"></span>
            </a>
        </span>
        <span v-else class="user-name user-name__loading">
            <i class="fas fa-spinner fa-spin"></i>
        </span>
    </script>

  <!-- User Badges Template -->
    <script type="text/x-template" id="user-badges-template">
        <div class="user-badges" v-if="badgeList && badgeList.length > 0">
            <div v-for="badge in badgeList"
                 :key="badge.id"
                 class="iconBadge"
                 :class="badge.styles && badge.styles.customClass"
                 :style="{
                   '--badge-styles-color': badge.styles ? badge.styles.color : 0,
                   '--badge-bg-color': 'hsl(' + (badge.styles ? badge.styles.color : 0) + ', 20%, 30%)',
                   '--badge-text-color': 'hsl(' + (badge.styles ? badge.styles.color : 0) + ', 100%, 80%)',
                   '--badge-border-color': 'hsl(' + (badge.styles ? badge.styles.color : 0) + ', 40%, 35%)',
                   'background-color': 'var(--badge-bg-color)',
                   'color': 'var(--badge-text-color)',
                   'border': '1px solid var(--badge-border-color)'
                 }"
                 data-popup-trigger
                 tabindex="0"
                 role="button"
                 :aria-label="badge.name">
                <span class="icon" v-if="badge.styles && badge.styles.icon" :class="badge.styles.iconClass" aria-hidden="true">
                    <i :class="badge.styles.icon"></i>
                </span>
                <div class="badge-panel position-top" :id="'badge-' + badge.id + '-desc'" data-popup role="tooltip">
                    <h3 v-text="badge.name"></h3>
                    <p v-text="badge.description"></p>
                    <div v-if="badge.styles && badge.styles.panelFooter" class="badge-panel-footer" v-text="badge.styles.panelFooter"></div>
                </div>
            </div>
        </div>
        <div v-else class="user-badges-empty"></div>
    </script>

  <!-- User Banner Template -->
    <script type="text/x-template" id="user-banner-template">
        <div class="user-profile-card-background" :style="bannerStyles">
            <div class="user-profile-overlay"></div>
        </div>
    </script>

  <!-- User Stats Template -->
    <script type="text/x-template" id="user-stats-template">
        <div :class="statsClasses" v-if="statItems && statItems.length > 0">
            <div class="user-stats__item" v-for="item in statItems" :key="item.label">
                <div class="user-stats__value">
                    <span v-text="item.value"></span><span v-if="item.suffix" v-text="item.suffix"></span>
                </div>
                <div class="user-stats__label" v-text="item.label"></div>
            </div>
        </div>
        <div v-else class="user-stats">
            <div class="user-stats__item">
                <div class="user-stats__value">-</div>
                <div class="user-stats__label">Loading...</div>
            </div>
        </div>
    </script>

  <!-- User Status Template -->
    <script type="text/x-template" id="user-status-template">
        <div :class="statusClasses">
            <!-- Indicator only -->
            <template v-if="style === 'indicator'">
                <div class="user-status__indicator"></div>
            </template>

            <!-- Text only -->
            <template v-else-if="style === 'text'">
                <span v-text="statusText"></span>
            </template>

            <!-- Full (default) -->
            <template v-else>
                <div class="user-status__indicator"></div>
                <span v-text="statusText"></span>
            </template>
        </div>
    </script>

  <!-- User Flag Template -->
    <script type="text/x-template" id="user-flag-template">
        <span class="user-flag" v-if="countryCode">
            <img :src="flagUrl" :alt="flagAlt" class="user-flag" />
        </span>
    </script>

  <!-- User Clan Template -->
    <script type="text/x-template" id="user-clan-template">
        <span class="user-clan" v-if="hasClan">
            <a :href="clanUrl" @click.stop="handleClick" class="user-clan-link">
                <span v-text="'[' + clanTag + ']'"></span>
            </a>
        </span>
    </script>

  <!-- User Rank Template -->
    <script type="text/x-template" id="user-rank-template">
        <div class="user-profile-card-ranks">
            <span class="user-profile-card-global-rank" v-if="globalRank">
                <span v-text="formatRank(globalRank)"></span>
            </span>
            <span class="user-profile-card-country-rank" v-if="showCountry && countryRank && country">
                <img :src="flagUrl" :alt="country" class="user-flag" />
                <span v-text="formatRank(countryRank)"></span>
            </span>
        </div>
    </script>

<!-- ==========================================================================
   Section: Composed Component Templates
   ========================================================================== -->

  <!-- User Hover Panel Template -->
    <script type="text/x-template" id="user-hover-panel-template">
        <div :class="panelClasses"
             @mouseenter="handleMouseEnter"
             @mouseleave="handleMouseLeave">
            <!-- Panel background -->
            <user-banner :userId="userId" type="banner" class="user-profile-panel-background"></user-banner>

            <!-- Panel header -->
            <div class="user-profile-panel-header">
                <user-avatar :userId="userId" class="user-profile-panel-avatar"></user-avatar>

                <div class="user-profile-panel-info">
                    <div class="user-profile-panel-name">
                        <user-clan :userId="userId" v-if="showClan"></user-clan>
                        <span v-text="userData?.info?.name || 'Loading...'"></span>
                    </div>

                    <user-rank :userId="userId" :showCountry="showCountry"></user-rank>

                    <user-badges :userId="userId" v-if="showBadges"></user-badges>
                </div>
            </div>

            <!-- Panel stats -->
            <user-stats :userId="userId" :fields="['pp', 'acc', 'plays']"></user-stats>

            <!-- Panel status -->
            <user-status :userId="userId" v-if="showStatus"></user-status>
        </div>
    </script>

  <!-- User Card Template -->
    <script type="text/x-template" id="user-card-template">
        <div class="user-profile-card-container">
            <a :href="profileUrl" class="user-profile-card">
                <!-- Card background (banner) -->
                <user-banner :userId="userId" type="banner"></user-banner>

                <!-- Card content -->
                <div class="user-profile-card-content">
                    <!-- Avatar and basic info -->
                    <div class="user-profile-card-header">
                        <div class="user-profile-card-avatar-container" 
                             :style="showStatus && statusData ? { '--user-status': 'var(--status-' + statusString + ')' } : {}">
                            <user-avatar :userId="userId" :showStatus="showStatus" class="user-profile-avatar with-status"></user-avatar>
                        </div>

                        <div class="user-profile-card-info">
                            <div class="user-profile-card-name">
                                <user-flag :userId="userId" v-if="showCountry"></user-flag>
                                <user-clan :userId="userId" v-if="showClan"></user-clan>
                                <span v-text="userData?.info?.name || 'Loading...'"></span>
                            </div>

                            <user-rank :userId="userId" :showCountry="showCountry"></user-rank>
                        </div>
                    </div>

                    <!-- Badges -->
                    <user-badges :userId="userId" v-if="showBadges"></user-badges>

                    <!-- Stats -->
                    <user-stats :userId="userId" :fields="['pp', 'acc', 'plays']"></user-stats>
                </div>
            </a>
        </div>
    </script>

  <!-- User Search Template -->
    <script type="text/x-template" id="user-search-template">
        <div class="user-profile-search-container">
            <a :href="profileUrl" class="user-profile-search">
                <div class="user-profile-overlay"></div>
                <user-avatar :userId="userId" class="user-profile-avatar search"></user-avatar>

                <div class="user-profile-search-info">
                    <div class="user-profile-search-name">
                        <user-flag :userId="userId" v-if="showCountry"></user-flag>
                        <user-clan :userId="userId" v-if="showClan"></user-clan>
                        <span v-text="userData?.info?.name || 'Loading...'"></span>
                    </div>

                    <div class="user-profile-search-stats" v-if="currentStats">
                        <span class="user-profile-search-stat">
                            <i class="fas fa-star"></i>
                            <span v-text="formatNumber(currentStats.pp) + 'pp'"></span>
                        </span>
                        <span class="user-profile-search-stat">
                            <i class="fas fa-crosshairs"></i>
                            <span v-text="formatAccuracy(currentStats.acc) + '%'"></span>
                        </span>
                        <span v-if="currentStats.rank" class="user-profile-search-stat">
                            <i class="fas fa-trophy"></i>
                            <span v-text="'#' + formatNumber(currentStats.rank)"></span>
                        </span>
                    </div>
                </div>
            </a>
        </div>
    </script>

  <!-- User Username Hover Template -->
    <script type="text/x-template" id="user-username-hover-template">
        <div :class="containerClasses">
            <span class="user-name"
                  @mouseover="showProfile"
                  @mouseout="hideProfile">
                <user-username :userId="userId" :showCountry="showCountry" :showClan="showClan"></user-username>
            </span>

            <!-- Hover panel -->
            <user-hover-panel
                :userId="userId"
                :visible="profileVisible"
                :showCountry="showCountry"
                :showClan="showClan"
                :showBadges="showBadges"
                :showStatus="showStatus"
                @mouseenter="mouseEnterPanel"
                @mouseleave="mouseLeavePanel"
            />
        </div>
    </script>
