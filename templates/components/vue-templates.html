        <script type="text/x-template" id="user-profile-hover-panel-template">
            <div :class="panelClasses"
                 @mouseenter="mouseEnterPanel"
                 @mouseleave="mouseLeavePanel">

              <!-- Panel background -->
              <div class="user-profile-panel-background"
                   :style="{ backgroundImage: 'url(' + bannerUrl + ')' }"></div>

              <!-- Panel header -->
              <div class="user-profile-panel-header">
                <div class="user-profile-panel-avatar"
                     :style="{ backgroundImage: 'url(' + avatarUrl + ')' }"></div>

                <div class="user-profile-panel-info">
                  <div class="user-profile-panel-name">
                    <span v-if="showClan && user.info.clan.tag" class="user-profile-panel-clan">
                      <span v-text="'[' + user.info.clan.tag + ']'"></span>
                    </span>
                    <span v-text="user.info.name"></span>
                  </div>

                  <div v-if="currentStats" class="user-profile-panel-rank">
                    <span class="user-profile-panel-global-rank">
                      <span v-text="currentStats.rank || '?'"></span>
                    </span>
                    <span v-if="showCountry && user.info.country" class="user-profile-panel-country">
                      <img :src="flagUrl" :alt="user.info.country" class="user-flag" />
                      <span v-text="'#' + currentStats.country_rank || '?'"></span>
                    </span>
                  </div>

                  <div v-if="showBadges && user.info.badges && user.info.badges.length > 0"
                       class="user-profile-panel-badges">
                    <badge v-for="badge in user.info.badges"
                           :key="badge.id"
                           :badge="badge"
                           :type="1"></badge>
                  </div>
                </div>
              </div>

              <!-- Panel stats -->
              <div v-if="currentStats" class="user-profile-panel-stats">
                <div class="user-profile-panel-stat-item">
                  <div class="user-profile-panel-stat-value">
                    <span v-text="formatNumber(currentStats.pp) || '0'"></span>
                  </div>
                  <div class="user-profile-panel-stat-label">PP</div>
                </div>

                <div class="user-profile-panel-stat-item">
                  <div class="user-profile-panel-stat-value">
                    <span v-text="formatAccuracy(currentStats.acc) + '%'"></span>
                  </div>
                  <div class="user-profile-panel-stat-label">Accuracy</div>
                </div>

                <div class="user-profile-panel-stat-item">
                  <div class="user-profile-panel-stat-value">
                    <span v-text="formatNumber(currentStats.plays) || '0'"></span>
                  </div>
                  <div class="user-profile-panel-stat-label">Plays</div>
                </div>
              </div>

              <!-- Panel status -->
              <div v-if="showStatus && statusData" class="user-profile-panel-status" :class="statusClasses">
                <i class="fas fa-circle"></i>
                <span v-text="statusText"></span>
              </div>
            </div>
        </script>

        <script type="text/x-template" id="user-profile-username-template">

                    <a :href="profileUrl" class="user-username-link">
                        <span v-text="user.info.name"></span>

                  :showClan="showClan"

        <script type="text/x-template" id="user-profile-template">

              <user-profile-username
                v-if="displayStyle === 'username'"

                :showClan="showClan"
                :showBadges="showBadges"
                :showStatus="showStatus"
                :interactive="interactive"
                :avatarUrl="avatarUrl"
                :bannerUrl="bannerUrl"
                :flagUrl="flagUrl"
                :clanUrl="clanUrl"
                :profileUrl="profileUrl"
                :currentStats="currentStats"
                :profileVisible="profileVisible"
                :formatNumber="formatNumber"
                :formatAccuracy="formatAccuracy"
                :statusText="statusText"
                :statusClasses="statusClasses"
                :statusString="statusString"
                :showProfile="showProfile"
                :hideProfile="hideProfile"
                :handleUsernameClick="handleUsernameClick"
                :handleClanClick="handleClanClick"
                :mouseEnterPanel="mouseEnterPanel"
                :mouseLeavePanel="mouseLeavePanel"
              />
              
              <!-- Card style -->
              <user-profile-card
                v-else-if="displayStyle === 'card'"
                :user="normalizedUserData"
                :statusData="statusData"
                :showCountry="showCountry"
                :showClan="showClan"
                :showBadges="showBadges"
                :showStatus="showStatus"
                :isLoadingStatus="isLoadingStatus"
                :avatarUrl="avatarUrl"
                :bannerUrl="bannerUrl"
                :flagUrl="flagUrl"
                :clanUrl="clanUrl"
                :profileUrl="profileUrl"
                :currentStats="currentStats"
                :formatNumber="formatNumber"
                :formatAccuracy="formatAccuracy"
                :statusText="statusText"
                :statusClasses="statusClasses"
                :statusString="statusString"
              />
              
              <!-- Search style -->
              <user-profile-search
                v-else-if="displayStyle === 'search'"
                :user="normalizedUserData"
                :showCountry="showCountry"
                :showClan="showClan"
                :avatarUrl="avatarUrl"
                :bannerUrl="bannerUrl"
                :flagUrl="flagUrl"
                :clanUrl="clanUrl"
                :profileUrl="profileUrl"
                :currentStats="currentStats"
                :formatNumber="formatNumber"
                :formatAccuracy="formatAccuracy"
              />
              
            </div>
            
            <!-- Loading state -->
            <div v-else-if="isLoadingUser" class="user-profile-loading">
              <i class="fas fa-spinner fa-spin"></i>
              <span>Loading user...</span>

            <!-- Error state -->
            <div v-else-if="error" class="user-profile-error">
              <i class="fas fa-exclamation-circle"></i>
              <span v-text="error"></span>

            <!-- No data state -->
            <div v-else class="user-profile-no-data">
              <span>No user data available</span>
            </div>

        <script type="text/x-template" id="badge-template">
            <span>
                <!-- Regular badge -->
                <div v-if="type === 0" class="badge" :class="badge.styles.customClass" :style="badgeStyle" data-popup-trigger tabindex="0" role="button" :aria-label="badge.name" :aria-describedby="badgeId + '-desc'">
                    <bg-effect-psy :settings="{ hue: badge.styles.color / 360, hueVariation: badge.styles.psyHueVar ? badge.styles.psyHueVar : 0.001, density: badge.styles.psyDensity ? badge.styles.psyDensity : 0, displacement: badge.styles.psyDisp ? badge.styles.psyDisp : 0.1, speed: badge.styles.psySpeed ? badge.styles.psySpeed : 0.2, gradient: badge.styles.psyGradient ? badge.styles.psyGradient : 0.15 }" :show-gui="false" :debug-level="0" v-if="badge.styles.customClass && badge.styles.customClass.includes('psy')"></bg-effect-psy>
                    <span class="icon" v-if="badge.styles.icon" :class="badge.styles.iconClass" aria-hidden="true">
                        <i v-bind:class="'' + badge.styles.icon"></i>
                    </span>
                    
                    <span class="badge-name" :class="badge.styles.nameClass" :id="badgeId" v-text="badge.name"></span>
                    
                    <!-- Popup panel for regular badge (inside the badge element) -->
                    <div class="badge-panel position-top" :class="badge.styles.panelClass" :style="panelStyle" :id="badgeId + '-desc'" data-popup role="tooltip" aria-live="polite">
                        <h3 v-text="badge.name"></h3>
                        <p v-text="badge.description"></p>
                        <div v-if="badge.styles.panelFooter" class="badge-panel-footer" v-text="badge.styles.panelFooter"></div>
                    </div>
                </div>
                
                <!-- Icon badge -->
                <div v-if="type === 1" class="iconBadge" :class="badge.styles.customClass" :style="badgeStyle" data-popup-trigger tabindex="0" role="button" :aria-label="badge.name" :aria-describedby="badgeId + '-desc'">
                    <span class="icon" v-if="badge.styles.icon" :class="badge.styles.iconClass" aria-hidden="true">
                        <i v-bind:class="'' + badge.styles.icon"></i>
                    </span>
                    
                    <!-- Popup panel for icon badge (inside the badge element) -->
                    <div class="badge-panel position-top" :class="badge.styles.panelClass" :style="panelStyle" :id="badgeId + '-desc'" data-popup role="tooltip" aria-live="polite">
                        <h3 v-text="badge.name"></h3>
                        <p v-text="badge.description"></p>
                        <div v-if="badge.styles.panelFooter" class="badge-panel-footer" v-text="badge.styles.panelFooter"></div>
                    </div>
                </div>
            </span>
        </script>

        <script type="text/x-template" id="score-card-template">
            <div class="map-single"
                :style="'background: linear-gradient(hsl(var(--main), 25%, 25%, 90%), hsl(var(--main), 25%, 25%, 90%)), url(https://assets.ppy.sh/beatmaps/' + score.beatmap.set_id + '/covers/cover.jpg)'"
                @click="scoreBus.$emit('show-score-window', score.id)">
                <div class="map-data">
                    <div class="map-image">
                        <img :src="'https://assets.ppy.sh/beatmaps/' + score.beatmap.set_id + '/covers/card.jpg'"
                            class="map-image-picture">
                    </div>
                    <div class="map-content1">
                        <div class="map-title-block">
                            <div class="map-title">
                                <a class="beatmap-link" @click.stop="beatmapBus.$emit('show-beatmap-panel', score.beatmap.id, score.beatmap.set_id)">
                                    <span v-text="score.beatmap.title"></span> [<span v-text="score.beatmap.version"></span>] <span v-if="score.mods != 0">+<span v-text="score.mods_readable"></span></span>
                                </a>
                            </div>
                            <div class="map-creators">
                                By <a class="" v-text="score.beatmap.artist"></a>
                                |
                                Mapped by <a v-text="score.beatmap.creator"></a>
                            </div>
                        </div>
                        <div class="play-stats-block">
                            <div class="play-stats">
                                <span v-text="formatNumber(score.score)"></span> / <span v-text="score.max_combo"></span><b>x</b> <span class="cheat_values" v-html="DisplayCheats(score.cheat_values)"></span>
                            </div>
                            <div class="map-date">
                                <time v-text="timeago ? timeago.format(score.play_time) : new Date(score.play_time).toLocaleString()"></time>
                            </div>
                        </div>
                    </div>
                    <div class="map-content2">
                        <div class="score-details d-flex">
                            <div class="score-details_right-block">
                                <div class="score-details_pp-block">
                                    <div class="map-pp">
                                        <span v-text="score.pp.toFixed()"></span><span class="map-pp-unit">pp</span>
                                    </div>
                                    <div class="map-acc">accuracy:&nbsp;<b>
                                        <span v-text="score.acc.toFixed(2)"></span>%
                                    </b></div>
                                </div>
                                <div class="score-details_grade-block">
                                    <div class="rank-single">
                                        <div :class="'map-rank rank-'+score.grade" v-text="score.grade.replace('X', 'SS').replace('H', '')"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </script>

        <script type="text/x-template" id="score-list-template">
            <div class="log-block" :class="{ 'load': loading }">
                <div class="header">
                    <div class="title">
                        <i class="fas fa-trophy"></i> <span v-text="title"></span>
                    </div>
                </div>
                <div v-if="scores.length > 0" class="scores">
                    <score-card 
                        v-for="(score, index) in scores" 
                        :key="score.id" 
                        :score="score"

                        @beatmap-click="$emit('beatmap-click', $event[0], $event[1])">

                </div>
                <div v-else-if="scores.length === 0" class="stats-block">
                    <div class="columns is-marginless">
                        <div class="column is-1">
                            <h1 class="title">: (</h1>
                        </div>
                        <div class="column">
                            <h1 class="title is-6" v-text="emptyMessage"></h1>
                            <p class="subtitle is-7" v-text="emptySubMessage"></p>
                        </div>
                    </div>
                </div>
                <div v-if="showMore" class="extra-block" id="hina-stats-block">
                    <a class="show-button" @click="loadMore">Show more</a>

            </div>

        <script type="text/x-template" id="bmap-card-template"> <!-- Note: Refactor this fucking mess into mutliple sub components -->
            <div :class="['beatmap-card', 'mode-' + mode, { 'expanded': expanded, 'interactive': interactive }]" 
                @click="handleClick">
                <!-- Loading state -->
                <div v-if="dataLoading" class="beatmap-loading-overlay">
                    <div class="beatmap-loading-spinner"></div>
                    <div class="beatmap-loading-text">Loading beatmap...</div>
                </div>
                
                <!-- Error state -->
                <div v-else-if="error" class="beatmap-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span v-text="error"></span>
                    <button @click.stop="loadMapData" class="beatmap-retry-btn">Retry</button>
                </div>
                
                <!-- Mini Mode -->
                <div v-else-if="mode === 'mini'" class="beatmap-mini">
                    <div class="beatmap-mini-background">
                        <img :src="cardUrl" alt="Beatmap Cover">
                        <div class="beatmap-mini-overlay"></div>
                    </div>
                    
                    <div class="beatmap-mini-content">
                        <!-- Single difficulty mode - show icon on the left -->
                        <div v-if="!showAllDifficulties" class="beatmap-mini-single-diff">
                            <div class="beatmap-mini-diff-icon-container" :style="{ '--diff-color': difficultyColor(selectedDifficulty) }" v-data-popup
                                :class="[selectedDifficulty.difficulty_rating ? 'difficulty-' + Math.floor(parseFloat(selectedDifficulty.difficulty_rating)) : '']">
                                
                                <!-- Difficulty icon with rank change indicator if available -->
                                <div class="beatmap-mini-diff-icon" @click.stop="beatmapBus.$emit('show-beatmap-panel', selectedDifficulty.id, mapData.set_id)" data-popup-trigger>
                                    <i :class="getModeIcon(selectedDifficulty.mode)" class="beatmap-mini-mode-icon"></i>
                                    
                                    <div v-if="rankChanges && rankChanges[selectedDifficulty.id]" class="beatmap-mini-rank-change"
                                        :style="{ backgroundColor: getRankChangeInfo(selectedDifficulty.id).color }">
                                        <i :class="['fas', getRankChangeInfo(selectedDifficulty.id).icon]"></i>
                                    </div>
                                </div>
                                
                                <!-- Popup panel with position based on screen location -->
                                <div :class="['beatmap-mini-popup', 'position-' + 'top']" data-popup> <!-- Remake Dynamic Position Logic -->
                                    <div class="beatmap-mini-popup-header">
                                        <div class="beatmap-mini-popup-title" :title="mapData.title" v-text="mapData.title || 'Loading...'"></div>
                                        <div class="beatmap-mini-popup-artist" :title="mapData.artist" v-text="mapData.artist || ''"></div>
                                        <div class="beatmap-mini-popup-version" :title="selectedDifficulty.version" v-text="selectedDifficulty.version || ''"></div>
                                    </div>
                                    
                                    <div class="beatmap-mini-popup-details">
                                        <div class="beatmap-mini-popup-creator" :title="'Mapped by ' + mapData.creator">
                                            Mapped by <span v-text="mapData.creator || ''"></span>
                                        </div>
                                        
                                        <div class="beatmap-mini-popup-stats">
                                            <div v-if="selectedDifficulty.bpm" class="beatmap-mini-popup-stat">
                                                <i class="fas fa-heartbeat"></i> <span v-text="Math.round(selectedDifficulty.bpm)"></span>bpm
                                            </div>
                                            <div v-if="selectedDifficulty.hit_length" class="beatmap-mini-popup-stat">
                                                <i class="fas fa-clock"></i> <span v-text="formatLength(selectedDifficulty.hit_length)"></span>
                                            </div>
                                            <div v-if="selectedDifficulty.difficulty_rating" class="beatmap-mini-popup-stat">
                                                <i class="fas fa-star" :style="{ color: difficultyStars ? difficultyStars.color : '#FFCC22' }"></i> 
                                                <span v-text="parseFloat(selectedDifficulty.difficulty_rating).toFixed(2)"></span>
                                            </div>
                                            <div v-if="showStatus" class="beatmap-mini-popup-stat">
                                                <span class="beatmap-mini-status" :style="{ backgroundColor: statusColor }" v-text="statusName"></span>
                                            </div>
                                        </div>
                                        
                                        <!-- Rank change info if available -->

    <script type="text/x-template" id="search-panel-template">
        <div id="search-panel" class="modal" :class="{ 'is-active': show }" style="z-index: 21;">
            <div class="modal-background" @click="close"></div>
    
            <div id="search" data-panel="Search" class="modal-content" :class="{ 'hidden': !show }">
                <div class="search-fg">
                    <!-- Header -->
                    <div class="search-header">
                        <h2>Search</h2>
                        <div class="kbd-hint">ESC to close</div>
                    </div>
    
                    <!-- Search Input -->
                    <div class="search-input-wrapper">
                        <input
                            type="search"
                            placeholder="Search for players or beatmaps..."
                            v-model="query"
                            @input="handleInput"
                            @keydown.esc="close"
                            ref="searchInput"
                            autocomplete="off"
                        >
                        <i class="fas fa-search search-icon"></i>
                        <button
                            v-if="query"
                            class="clear-btn"
                            @click="resetQuery"
                            title="Clear search"
                        >
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
    
                    <div class="search-divider"></div>
    
                    <!-- Search Results -->
                    <div class="search-container">
                        <!-- Players Section -->
                        <div class="search-section" v-if="hasSearched">
                            <div class="search-section-header player-results">
                                <i class="fas fa-users icon"></i>
                                <h3>Players</h3>
                                <span class="count" v-if="players.length > 0" v-text="players.length"></span>
                            </div>
    
                            <div class="results-container" :class="{ loading: playersLoading, empty: !playersLoading && players.length === 0 }">
                                <div v-if="playersLoading" class="loading-spinner"></div>
                                <div v-else-if="playersError" class="error-message">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <span v-text="playersError"></span>
                                </div>
                                <div v-else-if="!playersLoading && players.length === 0" class="no-results">
                                    <i class="fas fa-user-slash"></i>
                                    <p>No players found</p>
                                </div>
                                <user-profile
                                    v-else
                                    v-for="player in players"
                                    :key="player.info.id"
                                    :user="player"
                                    displayStyle="search"
                                ></user-profile>
                            </div>
                        </div>
    
                        <!-- Beatmaps Section -->
                        <div class="search-section" v-if="hasSearched">
                            <div class="search-section-header beatmap-results">
                                <i class="fas fa-music icon"></i>
                                <h3>Beatmaps</h3>
                                <span class="count" v-if="maps.length > 0" v-text="maps.length"></span>
                            </div>
    
                            <div class="results-container" :class="{ loading: mapsLoading, empty: !mapsLoading && maps.length === 0 }">
                                <div v-if="mapsLoading" class="loading-spinner"></div>
                                <div v-else-if="mapsError" class="error-message">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <span v-text="mapsError"></span>
                                </div>
                                <div v-else-if="!mapsLoading && maps.length === 0" class="no-results">
                                    <i class="fas fa-music-slash"></i>
                                    <p>No beatmaps found</p>
                                </div>
                                <div
                                    v-else
                                    v-for="map in maps"
                                    :key="map.SetID"
                                    class="bm-search-result"
                                    :id="map.SetID"
                                    @click="openBeatmapPanel(map)"
                                >
                                    <div class="bm-search-result-container">
                                        <div class="thumbnail">
                                            <img
                                                v-if="!map.thumbnailError"
                                                :src="'https://assets.ppy.sh/beatmaps/' + map.SetID + '/covers/card@2x.jpg'"
                                                @load="map.thumbnailError = false"
                                                @error="map.thumbnailError = true"
                                                alt="Beatmap thumbnail"
                                            >
                                            <i v-else class="fas fa-music fallback-icon"></i>
                                            <div class="play-overlay" @click.stop="interract(map.SetID)">
                                                <div class="play-btn" :class="{ playing: currentAudio && currentAudio.id === 'audio-' + map.SetID }">
                                                    <i :class="currentAudio && currentAudio.id === 'audio-' + map.SetID ? 'fas fa-pause' : 'fas fa-play'"></i>
                                                </div>
                                            </div>
                                            <audio
                                                :src="'https://b.ppy.sh/preview/' + map.SetID + '.mp3'"
                                                :id="'audio-' + map.SetID"
                                            ></audio>
                                        </div>

                                        <div class="info">
                                            <div class="title" v-text="map.Title"></div>
                                            <div>
                                                <span class="artist" v-text="map.Artist"></span>
                                                <span class="creator" v-text="'by ' + map.Creator"></span>
                                            </div>
                                            
                                            <div class="mode-icons">
                                                <difficulty-icon
                                                    v-for="(childMap, index) in getNormalizedDifficulties(map)"
                                                    :key="childMap.id"
                                                    v-if="index < 8"
                                                    :diff="childMap"
                                                    :setId="map.SetID"
                                                    :interactive="true"
                                                ></difficulty-icon>
                                                <div v-if="map.ChildrenBeatmaps.length > 8" class="mode-icon" title="More difficulties available">
                                                    <span style="font-size: 0.7rem; color: hsl(var(--main), 40%, 60%);" v-text="'+' + (map.ChildrenBeatmaps.length - 8)"></span>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="actions">
                                            <a
                                                class="action-btn play"
                                                :class="{ playing: currentAudio && currentAudio.id === 'audio-' + map.SetID }"
                                                @click.stop="interract(map.SetID)"
                                                title="Preview audio"
                                            >
                                                <i :class="currentAudio && currentAudio.id === 'audio-' + map.SetID ? 'fas fa-pause' : 'fas fa-play'"></i>
                                            </a>
                                            <a
                                                class="action-btn download"
                                                :href="'https://osu.direct/d/' + map.SetID"
                                                title="Download beatmap"
                                                target="_blank"
                                                @click.stop
                                            >
                                                <i class="fas fa-download"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
    
                        <!-- Empty State (no search yet) -->
                        <div v-if="!hasSearched" class="empty-state">
                            <i class="fas fa-search"></i>
                            <p>Start typing to search for players or beatmaps</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

                                    <div class="doc-content">

                                        cheats that modify the score's replay data (e.g. tap data or aim data, or playing with the in-game Relax mod, then removing it on submission) </br>
                                        and score editors are <b>NOT</b> allowed, this rule may be enforced outside of the examples given. It is discretionary.

                                    <div class="doc-content">
                                        <p>For Ainu users, make sure the client you use was downloaded on MPGH, the Skoot.er Discord server or the Ainu Xheaters Discord server, otherwise it contains prohibited features.</br>

                            <div class="doc-section">
                                <h1>Connecting to Kawata</h1>
                                <div class="subsection">
                                    <h2>New method (-devserver flag)</h2>
                                    osu! has added *official-ish* support for private servers.</br>
                                    That means you can now easily connect to Kawata, without tampering with your system files. This is the recommended method.</br>
                                    Please note that some unofficial osu! clients may not be compatible with this new method yet.
                                    <div class="doc-content">
                                        <h3>Launching osu! on Kawata</h3>
                                        <p>
                                            - Open your osu! installation folder.</br>
                                            - Click the address bar, and type "osu!.exe -devserver Kawata.pw".</br>
                                            - Open osu! and log in with your Kawata account.
                                        </p>
                                    </div>
                                    <div class="doc-content">
                                        <h3>Creating a shortcut to connect quickly</h3>
                                        <p>
                                            - Open your osu! installation folder.</br>
                                            - Create a shortcut to osu!.exe wherever you want, or copy your existing shortcut.</br>
                                            - Right-click your newly created shortcut, and click <b>Properties</b>.</br>
                                            - In the <b>Target</b> field of the <b>Properties</b> window, add "-devserver Kawata.pw" to the existing text.</br>
                                            - Open your newly created shortcut and log in with your Kawata account.
                                        </p>
                                    </div>
                                </div>

                                <h1>Connecting to Kawata: </h1>
                                <div class="subsection">
                                    <h2>Old method (server switcher) (legacy/unsupported)</h2>
                                    This is the traditional method for connecting to private servers. </br>
                                    This method requires administrator access, as it implies tampering with the osu! certificate, and the hosts file. </br>
                                    This method is considered legacy and should only be used in cases where the new method cannot be used.
                                    <div class="doc-content">
                                        <h3>Certificate installation</h3>
                                        If you want to play on Kawata, you must install our HTTPS certificate. </br> 
                                        Do this only the first time you connect to Kawata.  </br>

                                            <p>
                                                - Open the switcher.</br>
                                                - Click on <b>"Install certificate"</b>.</br>
                                                - Click <b>"Yes"</b>.

                                    <div class="doc-content">
                                        <h3>How to connect to Kawata</h3>
                                        <div class="subsection">
                                            <p>
                                                - Run the switcher <b>as administrator</b></br>
                                                - Click "Connect to Kawata".</br>
                                                - Make sure that the switcher says <b>"You're connected to Kawata!"</b> (it should look like <a href="https://i.imgur.com/0LotBDY.png">this</a>), if not, click <b>"Connect to Kawata"</b> to switch servers.</br>
                                                - Open osu! and log in with your Kawata account.
                                            </p>
                                        </div>
                                    </div>

                                                - Open osu! and log in with your osu! account.
                                            </p>
                                        </div>
                                        NOTE: If you want to connect to osu.ppy.sh and you still see Kawata's website even if the switcher is off, empty your browser cache.
                                    </div>
                                    <div class="doc-content">
                                        <h3>How to update osu!/switch release branch</h3>
                                        <div class="subsection">
                                            <p>
                                                - Make sure osu! is <b>closed</b>.</br>

                        <div class="doc-block" v-if="page === 'Cert'">
                            <div class="doc-section">
                                <h1>Installing the certificate manually</h1>
                                <p>If you're having trouble connecting to Kawata using stable (latest), beta, or cutting edge, or the switcher doesn't install the certificate properly, you can install the certificate manually.</p>
                                <div class="subsection">
                                    <h3>Instructions:</h3>
                                    <div class="doc-content">
                                        <p>
                                            - To begin, obtain the certificate <a href="/static/cert.crt">by clicking here</a>.</br>
                                            - Then, open certificate.crt.</br>
                                            - Click the "Install certificate..." button.</br>
                                            - Click Next.</br>
                                            - Click "Browse..." after selecting "Place all certificates in the following store" (the second option).</br>
                                            - A new window will pop up, select Trusted root certification authorities and click Ok.</br>
                                            - Click Next.</br>
                                            - Click Finish.</br>
                                        </p>
                                    </div>
                                </div>
                                <div class="subsection">
                                    <h3>How to test the certificate:</h3>
                                    <p>To ensure the certificate has been installed successfully, make sure the switcher is On and open <a href="https://c.ppy.sh/">this page</a>.</p>
                                    <div class="doc-content">
                                        <p>
                                            - If you see <a href="http://y.zxq.co/ubfzty.png">osu!bancho stuff</a>, your switcher is off. Turn it on and try again.</br>
                                            - If you see <a href="http://y.zxq.co/zphobw.png">some ripple stuff</a>, you're successfully connected to Kawata under HTTPS, good job!</br>
                                            - If you get <a href="http://y.zxq.co/reaueu.png">some certificate or security error</a>, the certificate has not been installed successfully. <b>Follow the instructions below.</b></br>
                                        </p>
                                    </div>
                                </div>
                                <div class="subsection">
                                    <h3>If everything else fails...</h3>
                                    <p>You can try to remove all existing Kawata/Ripple/Akatsuki/Enjuu/whatever certificates and install the certificate again. Follow these steps:</p>
                                    <div class="doc-content">
                                        <p>
                                            - Press <b>Win+R</b>  - In the run box, type "mmc certmgr.msc" and press "enter" to launch the Certificate Manager.</br>
                                            - Select <b>Trusted root certification authorities</b> on the left.</br>
                                            - On the right, click "Certificates."</br>
                                            - You should see a <a href="https://i.imgur.com/iJlLOg3.png">Kawata</a> entry and one or two <b>*.ppy.sh</b> entries in the list. Select them, then right-click and select "Delete."</br>
                                            - Select all the positive options.</br>
                                            - Launch the switcher, then select "Install certificate," followed by "Yes."- Connecting to <a href="https://c.ppy.sh/">Kawata's bancho server via https</a> should work.</br>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                                            <td class="leaderboard-table__column leaderboard-column__hitstat" v-text="score.n300 + score.ngeki"></td>
                                            <td class="leaderboard-table__column leaderboard-column__hitstat" v-text="score.n100 + score.nkatu"></td>
                                            <td class="leaderboard-table__column leaderboard-column__hitstat" v-text="score.n50"></td>
                                            <td class="leaderboard-table__column leaderboard-column__miss zero" v-text="score.nmiss"></td>
                                            <td class="leaderboard-table__column leaderboard-column__mods" v-text="score.mods_readable"></td>
                                            <td class="leaderboard-table__column leaderboard-column__date tooltip-container">
                                                <span v-text="formatTimeAgo(score.play_time)"></span>
                                                <div class="tooltip-content">
                                                    <span v-text="formatDate(score.play_time)"></span>
                                                </div>
                                            </td>
                                            <td class="leaderboard-table__column leaderboard-column__report"><i class="fa-solid fa-triangle-exclamation"></i></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    
                    <!-- ================= LOADING/ERROR STATE ================= -->
                    <div class="content" v-else>
                        <div style="text-align: center; padding: 40px;">
                            <span v-if="beatmaps.length === 0">Loading beatmap data...</span>
                            <span v-else>No beatmap data available</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>
    
    <script type="text/x-template" id="score-panel-template">
        <div id="score-panel-modal" class="modal" :class="{ 'is-active': show }" style="z-index: 26;">
            <div class="modal-background" @click="close"></div>
    
            <!-- Loading State -->
            <div v-if="fetchState === 'loading'" class="modal-content loading-state" style="max-width: 500px; margin: 100px auto; background: hsl(var(--main), 20%, 15%); padding: 20px; border-radius: 8px; text-align: center; animation: fadeIn 0.3s ease-out;">
                <div style="color: #4a9eff; font-size: 18px; margin-bottom: 10px; animation: pulse 1.5s ease-in-out infinite;">
                    <i class="fas fa-spinner fa-spin"></i> Loading Score...
                </div>
                <div style="color: #888; font-size: 12px;">
                    Score ID: <span v-text="scoreId"></span>
                </div>
            </div>
    
            <!-- Error Display -->
            <div v-if="fetchState === 'error'" class="modal-content error-state" style="max-width: 500px; margin: 100px auto; background: #2c2c2c; padding: 20px; border-radius: 8px; animation: slideIn 0.3s ease-out;">
                <div style="color: #ff6b6b; font-size: 18px; margin-bottom: 10px; animation: shake 0.5s ease-out;">
                    <i class="fas fa-exclamation-triangle"></i> Error Loading Score
                </div>
                <div style="color: #ccc; margin-bottom: 15px;">
                    <span v-text="fetchError || 'An unknown error occurred'"></span>
                </div>
                <div style="color: #888; font-size: 12px; margin-bottom: 15px;">
                    Score ID: <span v-text="scoreId"></span>
                </div>
                <button @click="close" style="background: #4a4a4a; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#5a5a5a'" onmouseout="this.style.background='#4a4a4a'">
                    Close
                </button>
            </div>
    
            <!-- Main Content - Only show when data is ready -->
            <div v-if="fetchState === 'success'" id="score-panel" data-panel="Score" class="modal-content" :class="{ 'hidden': !show && fetchState !== 'success' }" style="animation: scaleIn 0.3s ease-out;">
                <!-- ================= MAIN BANNER ================= -->
                <div class="main-block">
                    <div class="main-banner" :style="{'--banner-bg': safeBeatmap && safeBeatmap.set_id ? `url(https://assets.ppy.sh/beatmaps/` + safeBeatmap.set_id + `/covers/cover@2x.jpg)` : 'none'}">
                        <!-- ===== SONG INFO ===== -->
                        <div id="SongInfo">
                            <div id="score-banner-map" class="map-info">
                                <span class="map-title" v-text="getBeatmapProperty('title', 'Unknown Beatmap')"></span>
    
                                <div class="map-artist-creator">
                                    <span v-text="getBeatmapProperty('artist', 'Unknown Artist')"></span>
                                    <span> || </span>
                                    <a
                                        v-if="safeBeatmap && safeBeatmap.creator"
                                        :href="'https://osu.ppy.sh/u/' + safeBeatmap.creator"
                                        v-text="safeBeatmap.creator"
                                    ></a>
                                    <span v-else>Unknown Creator</span>
                                </div>
                            </div>
                            <div id="score-banner-score-info" class="score-info">
                                <div class="grade-info">
                                    <div class="grade-tower">
                                        <div class="grade-tower-layer" :class="{ passed: isGradePassed('SS') }">
                                            <div class="grade-icon grade-ss"></div>
                                        </div>
                                        <div class="grade-tower-layer" :class="{ passed: isGradePassed('S') }">
                                            <div class="grade-icon grade-s"></div>
                                        </div>
                                        <div class="grade-tower-layer" :class="{ passed: isGradePassed('A') }">
                                            <div class="grade-icon grade-a"></div>
                                        </div>
                                        <div class="grade-tower-layer" :class="{ passed: isGradePassed('B') }">
                                            <div class="grade-icon grade-b"></div>
                                        </div>
                                        <div class="grade-tower-layer" :class="{ passed: isGradePassed('C') }">
                                            <div class="grade-icon grade-c"></div>
                                        </div>
                                        <div class="grade-tower-layer" :class="{ passed: isGradePassed('D') }">
                                            <div class="grade-icon grade-d"></div>
                                        </div>
                                    </div>
                                    <!-- TEMP: Grade Dial (future implementation): Commented out for now. -->
                                    <!--<div class="grade-dial">
                                        <div class="grade-dial-layer"></div>
                                        <div class="grade-dial-layer-grade">
                                            <span v-text="safeScore ? safeScore.grade : '-'"></span>
                                        </div>
                                    </div>-->
                                </div>
                                <div class="score-details">
                                    <div class="score-value" v-text="safeScore ? addCommas(safeScore.score) : '0'"></div>
                                    <div class="player-info">
                                        <div class="info-key">
                                            <span>Played by:</span>
                                            <span>Submitted on:</span>
                                        </div>
                                        <div class="info-value">
                                            <a
                                                v-if="safePlayer && safeScore"
                                                :href="'/u/' + safeScore.userid"
                                                v-text="getPlayerProperty('name', 'Unknown Player')"
                                            ></a>
                                            <span v-else-if="safeScore">Loading...</span>
                                            <span v-else>Unknown Player</span>
                                            <br>
                                            <span v-text="safeScore ? formatDate(safeScore.play_time) : '-'"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="score-buttons">
                                    <button class="button score-button is-primary" @click="DownloadReplay(safeScore.id)" :disabled="!safeScore">
                                        Download Replay
                                    </button>
                                    <button class="button score-button" @click="" :disabled="!safeScore">
                                        View Beatmap Page
                                    </button>
                                    <button class="button score-button not-ready" @click="" :disabled="!safeScore" tooltip="You can use this to watch a replay of this score in your browser!">
                                        Open Beatmap in JoSu!
                                    </button>
                                    <button class="button score-button" @click="shareScore()" :disabled="!safeScore">
                                        Share Score
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
    
                <!-- ================= SECOND BLOCK ================= -->
                <div class="second-block">
                    <div class="content">
                        <div class="selector">
                            <a
                                class="tab-item"
                                :class="{ 'is-active': activeTab === 'Score' }"
                                @click="activeTab = 'Score'"
                            >
                                Score
                            </a>
                            <a
                                v-if="hasCheats"
                                class="tab-item"
                                :class="{ 'is-active': activeTab === 'Cheats' }"
                                @click="activeTab = 'Cheats'"
                            >
                                Cheats
                            </a>
                            <a
                                class="tab-item not-ready"
                                :class="{ 'is-active': activeTab === 'Comments' }"
                                @click="activeTab = 'Comments'"
                            >
                                Comments
                            </a>
                        </div>
                        <div class="tab-content" :class="{ 'active': activeTab === 'Score' }">
                            <div class="score-overview">
                                <div class="score-player">
                                    <div v-if="!safePlayer" class="player-loading" style="padding: 20px; text-align: center; color: #888; animation: fadeIn 0.3s ease-out;">
                                        Loading player info...
                                    </div>
                                    <user-profile v-show="safePlayer" :user="safePlayer" displayStyle="card" showCountry="true" style="width: 100%; animation: fadeIn 0.3s ease-out 0.1s both;"></user-profile>
                                </div>
                                <div class="score-stats">
                                    <div class="stat-block">
                                        <div class="stat-bubble">
                                            <div class="stat-title">Accuracy</div>
                                            <span v-text="safeScore ? safeScore.acc.toFixed(2) + '%' : '-'"></span>
                                        </div>
                                        <div class="stat-bubble">
                                            <div class="stat-title">Combo</div>
                                            <span v-text="safeScore ? safeScore.max_combo + 'x' : '-'"></span>
                                        </div>
                                        <div class="stat-bubble">
                                            <div class="stat-title">PP</div>
                                            <span v-text="safeScore ? safeScore.pp.toFixed(2) : '-'"></span>
                                        </div>
                                        <div v-if="safeScore && safeScore.mods !== 0" class="stat-bubble">
                                            <div class="stat-title">Mods</div>
                                            <span v-text="safeScore.mods_readable"></span>
                                        </div>
                                    </div>
                                    <div class="stat-block">
                                        <div class="stat-bubble">
                                            <div class="stat-title lowercase">300s</div>
                                            <span v-text="safeScore ? safeScore.n300 + safeScore.ngeki : '-'"></span>
                                        </div>
                                        <div class="stat-bubble">
                                            <div class="stat-title lowercase">100s</div>
                                            <span v-text="safeScore ? safeScore.n100 + safeScore.nkatu : '-'"></span>
                                        </div>
                                        <div class="stat-bubble">
                                            <div class="stat-title lowercase">50s</div>
                                            <span v-text="safeScore ? safeScore.n50 : '-'"></span>
                                        </div>
                                        <div class="stat-bubble">
                                            <div class="stat-title">Misses</div>
                                            <span v-text="safeScore ? safeScore.nmiss : '-'"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div v-if="hasCheats" class="tab-content" :class="{ 'active': activeTab === 'Cheats' }">
                            <div class="cheats-container">
                                <div class="cheats-header">
                                    <i class="fas fa-shield-alt"></i>
                                    <span>Cheat Values</span>
                                </div>
                                <div class="cheats-categories">
                                    <div v-for="category in getCheatValuesByCategory()" :key="category.name" class="cheat-category">
                                        <div class="category-header">
                                            <i class="fas fa-chevron-right"></i>
                                            <span v-text="category.name"></span>
                                            <span class="category-count" v-text="'(' + category.values.length + ')'"></span>
                                        </div>
                                        <div class="category-values">
                                            <div v-for="item in category.values" :key="item.key" class="cheat-item">
                                                <span class="cheat-key" v-text="getCheatDisplayName(item.key)"></span>
                                                <span class="cheat-value" v-text="item.value"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="tab-content" :class="{ 'active': activeTab === 'Comments' }">
                            <div class="not-ready-message">
                                <i class="fas fa-construction"></i>
                                <span>Comments are not yet available.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>
